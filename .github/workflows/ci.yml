name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -short -count=1
      - name: Integration test
        run: go test ./internal/scaffold/... -count=1 -timeout=10m
